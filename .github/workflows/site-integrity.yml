name: Static site checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify local links and images
        run: python scripts/check_site.py
